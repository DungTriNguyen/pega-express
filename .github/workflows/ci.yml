name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quét bí mật
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://pega-express-web.workers.dev
          DEPLOY_ENV: preview
      - name: E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --trace off
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

  production-gate:
    # Chặn deploy production nếu còn dữ liệu demo (plan mục 4.4)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:demo
        env:
          DEPLOY_ENV: production
