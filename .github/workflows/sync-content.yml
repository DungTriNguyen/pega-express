name: Đồng bộ nội dung từ Google Sheets

# Kích hoạt bằng nút trong Google Sheets (Apps Script gọi workflow_dispatch) hoặc theo lịch.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 08:00 giờ Việt Nam

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:sheets
        env:
          GOOGLE_SHEETS_CONTENT_ID: ${{ secrets.GOOGLE_SHEETS_CONTENT_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-content
          commit-message: "chore(content): đồng bộ dữ liệu từ Google Sheets"
          title: "chore(content): đồng bộ dữ liệu từ Google Sheets"
          body: "Tự động tạo bởi workflow sync-content. Kiểm tra link preview trước khi merge."
